<style>
#accountModal { align-items: flex-end; padding: 0; }
#accountModal .modal-inner { width: 100%; max-width: 520px; max-height: 92vh; border-radius: 28px 28px 0 0; padding: 10px 24px max(28px, env(safe-area-inset-bottom)); transition: transform .22s ease; will-change: transform; }
#accountModal .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--muted); opacity: .45; margin: 0 auto 16px; }
#accountModal .linkbtn { background: none; border: 0; padding: 0; margin: 6px 0 0; font: inherit; font-size: 13px; color: #ff6b5e; text-decoration: underline; cursor: pointer; }
#accountModal .sect { margin: 22px 0 8px; font-size: 13px; color: var(--muted); }
#accountModal .swrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0; font-size: 15px; }
#accountModal .sw { position: relative; width: 51px; height: 31px; flex: none; }
#accountModal .sw input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; z-index: 2; cursor: pointer; }
#accountModal .sw i { position: absolute; inset: 0; border-radius: 16px; background: rgba(128,128,128,.35); transition: background .2s; }
#accountModal .sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
#accountModal .sw input:checked + i { background: #f5d142; }
#accountModal .sw input:checked + i::after { transform: translateX(20px); }
#accountModal .sw input:disabled { cursor: default; }
#notifSub { margin-top: 6px; transition: opacity .2s; }
#notifSub.dim { opacity: .38; pointer-events: none; }
#notifSub .swrow { padding: 10px 0 0; font-size: 14px; }
</style>
<div id="accountModal" class="modal hidden">
  <div class="modal-inner">
    <div class="grab" aria-hidden="true"></div>
    <h3>Account &amp; settings</h3>
    <div id="acctSignedOut">
      <p class="modal-hint">Sign in to keep your projects and tracks in your account and open them on any device.</p>
      <div style="display:flex;gap:8px;margin-bottom:10px"><button type="button" id="acctTabIn" class="btn small primary">Sign in</button><button type="button" id="acctTabUp" class="btn small">Create account</button></div>
      <input type="email" id="acctEmail" class="field" style="width:100%;margin-bottom:8px" placeholder="Email" autocomplete="email" autocapitalize="none" autocorrect="off">
      <input type="password" id="acctPass" class="field" style="width:100%" placeholder="Password" autocomplete="current-password">
      <div class="modal-actions"><button type="button" id="acctForgot" class="btn small">Forgot password</button><button type="button" id="acctSubmit" class="btn primary">Sign in</button></div>
      <div class="modal-actions"><button type="button" id="acctSkip" class="btn small">Keep using without an account</button><span></span></div>
    </div>
    <div id="acctCode" class="hidden">
      <p class="modal-hint">Enter the 6-digit code from the email.</p>
      <input type="text" id="acctCodeInput" class="field" style="width:100%" inputmode="numeric" maxlength="8" placeholder="123456" autocomplete="one-time-code">
      <div class="modal-actions"><span></span><button type="button" id="acctCodeGo" class="btn primary">Continue</button></div>
    </div>
    <div id="acctReset" class="hidden">
      <input type="password" id="acctNewPass" class="field" style="width:100%" placeholder="New password" autocomplete="new-password">
      <div class="modal-actions"><span></span><button type="button" id="acctNewPassGo" class="btn primary">Save password</button></div>
    </div>
    <div id="acctSignedIn" class="hidden">
      <p id="acctEmailLine" style="margin:0 0 4px;font-weight:600"></p>
      <p id="acctSyncLine" class="modal-hint" style="margin:0"></p>
      <button type="button" id="acctDelete" class="linkbtn">Delete account</button>
    </div>
    <p class="sect">Appearance</p>
    <div class="theme-seg"><button type="button" class="btn small" data-theme-pref="system">Device</button><button type="button" class="btn small" data-theme-pref="light">Light</button><button type="button" class="btn small" data-theme-pref="dark">Dark</button></div>
    <p class="sect">Plan <span class="muted small">(for testing, purchases come later)</span></p>
    <div class="theme-seg"><button type="button" class="btn small" data-tier-pref="artist">Artist</button><button type="button" class="btn small" data-tier-pref="plus">Plus</button><button type="button" class="btn small" data-tier-pref="pro">Pro</button></div>
    <p class="sect">Notifications</p>
    <label class="swrow"><span>Allow notifications</span><span class="sw"><input type="checkbox" id="pushToggle"><i></i></span></label>
    <p class="muted small" id="pushStatus" style="margin:6px 0 0"></p>
    <div id="notifSub" class="dim">
      <label class="swrow"><span>A band finishes uploading their info</span><span class="sw"><input type="checkbox" data-notif="finished" disabled><i></i></span></label>
      <label class="swrow"><span>The morning of a shoot</span><span class="sw"><input type="checkbox" data-notif="shootday" disabled><i></i></span></label>
      <label class="swrow"><span>An hour before a call time (with the location)</span><span class="sw"><input type="checkbox" data-notif="calltime" disabled><i></i></span></label>
    </div>
    <p class="sect">Help</p>
    <button type="button" id="tourReplayBtn2" class="btn small">Show the quick tour again</button>
    <p id="acctMsg" class="muted small" style="margin:10px 0 0;min-height:1em"></p>
    <div id="acctBottom" style="margin-top:18px"><button type="button" id="acctSignOut" class="btn small">Sign out</button></div>
  </div>
</div>
<style>#acctSignedIn.hidden ~ #acctBottom { display: none; }</style>
<script>
(function () {
  var m = document.getElementById("accountModal"), inner = m && m.querySelector(".modal-inner"); if (!m) return;
  function close() { m.classList.add("hidden"); var g = document.getElementById("acctMsg"); if (g) g.textContent = ""; if (inner) inner.style.transform = ""; }
  m.addEventListener("click", function (e) { if (e.target === m) close(); });
  var y0 = null, dy = 0;
  inner.addEventListener("touchstart", function (e) { y0 = (e.touches.length === 1 && inner.scrollTop <= 0) ? e.touches[0].clientY : null; dy = 0; inner.style.transition = "none"; }, { passive: true });
  inner.addEventListener("touchmove", function (e) { if (y0 === null) return; dy = e.touches[0].clientY - y0; if (dy > 0) inner.style.transform = "translateY(" + dy + "px)"; else { dy = 0; inner.style.transform = ""; } }, { passive: true });
  inner.addEventListener("touchend", function () { inner.style.transition = ""; if (y0 !== null && dy > 110) close(); else inner.style.transform = ""; y0 = null; });
})();
</script>
